name: Deploy cypherpunk.agency homepage

# Push to main → build the homepage (packages/plaza-design-demo/scripts/generate-demos.tsx
# → dist-homepage/) → publish to the Caddy VM at /mnt/pd/data/services/static/cypherpunk-agency
# → live at https://cypherpunk.agency (apex + www).
#
# Transport follows the current static-deploy standard (same as orbis):
#   1. the runner uploads the tarball to the GCS staging bucket with a raw media upload
#      (the deploy SA may create objects there but not list, read or overwrite them);
#   2. one IAP-tunnelled SSH call — control path only, no payload — has the VM pull the
#      object with its own identity, extract it into /tmp unprivileged, re-check it, and
#      run exactly ONE pinned sudo command.
#
# The privileged step is an OVERLAY, on purpose:
#   sudo /bin/cp -rT /tmp/cypherpunk-agency-deploy /mnt/pd/data/services/static/cypherpunk-agency
# The served dir also holds /good-friday/, which is not in this repo and must survive.
# Never rsync --delete or rm inside it. The command must stay byte-for-byte identical to
# the sudoers pin or sudo refuses it. Filenames are stable (no content hashes), so the
# overlay never accumulates stale builds.
#
# The VM's shared CSP is `default-src 'self'` with no font-src: everything the page loads
# must be same-origin. Fonts ship as files under /fonts/ (data: URIs are blocked too).
#
# PUBLIC REPO: logs and this file are world-readable. Never use pull_request_target, never
# echo secrets, tokens or VM addresses, never print curl's redirect_url or gcloud debug output.

on:
  push:
    branches: [main]
    paths:
      - packages/plaza-design-demo/src/ssg/**
      - packages/plaza-design-demo/scripts/generate-demos.tsx
      - packages/plaza-design-demo/package.json
      - packages/plaza-design-core/**
      - og-image.png
      - pnpm-lock.yaml
      - .github/workflows/deploy-homepage.yml
  workflow_dispatch:

permissions:
  contents: read

# Two runs overlaying the same directory would race; queue them instead.
concurrency:
  group: deploy-homepage
  cancel-in-progress: false

jobs:
  build:
    # No id-token here: `pnpm install` runs third-party code, and it never gets the
    # ability to mint a GCP identity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:homepage

      - name: Guard + package
        # Fail before anything leaves the runner. A 0-byte og-image.png is exactly the
        # bug the hand-copied deploy shipped.
        run: |
          set -euo pipefail
          OUT=packages/plaza-design-demo/dist-homepage
          test -f "$OUT/index.html" || { echo "::error::index.html missing"; exit 1; }
          grep -qF '<title>[cypherpunk.agency]</title>' "$OUT/index.html" || { echo "::error::index.html lacks the expected title"; exit 1; }
          test -s "$OUT/og-image.png" || { echo "::error::og-image.png missing or empty"; exit 1; }
          # Same-origin only: no stylesheet imports, no external src=, url() or <link href>.
          if grep -Eq '@import|fonts\.(googleapis|gstatic)\.com' "$OUT/index.html"; then
            echo "::error::index.html imports external CSS/fonts — the VM CSP blocks it"; exit 1
          fi
          if grep -Eiq '(src=|url\()["'"'"']?(https?:)?//|<link[^>]*href=["'"'"']?(https?:)?//' "$OUT/index.html"; then
            echo "::error::index.html loads a cross-origin resource — the VM CSP blocks it"; exit 1
          fi
          # Every font the CSS references must be in the payload.
          for f in $(grep -o 'url("\./fonts/[^"]*")' "$OUT/index.html" | sed 's/url("\.\///; s/")$//' | sort -u); do
            test -s "$OUT/$f" || { echo "::error::$f referenced but not built"; exit 1; }
          done
          tar -czf homepage.tgz -C "$OUT" .
          tar -tzf homepage.tgz
          ls -l homepage.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: homepage
          path: |
            homepage.tgz
            packages/plaza-design-demo/dist-homepage/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    # workflow_dispatch can be started from any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-level permissions replace the workflow-level block: only this job can mint
    # the OIDC token for Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: cyberphunk-agency-deploy-staging
      SITE_URL: https://cypherpunk.agency
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homepage

      # Keyless: there is no service-account JSON key for this repo. The SA trusts only
      # attribute.repository == cypherpunk-agency/plaza-design.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/422633553646/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy-plaza-design@cyberphunk-agency.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Stage the tarball in GCS
        # Raw media upload: the deploy SA can create objects but not list, read or
        # overwrite them, which rules out `gcloud storage cp`. A re-run cannot overwrite
        # either, hence the run attempt in the object name.
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          object="cypherpunk-agency/${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tgz"
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/gzip" \
            --data-binary @homepage.tgz \
            "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=${object//\//%2F}" \
            -o /dev/null
          echo "OBJECT=$object" >> "$GITHUB_ENV"

      # Persistent deploy SSH key. Without --ssh-key-file, gcloud mints a fresh key every
      # run into project ssh-keys metadata (hard-capped at 256 KiB).
      - name: Materialize deploy SSH key
        env:
          KEY: ${{ secrets.GCP_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gcp_deploy
          chmod 600 ~/.ssh/gcp_deploy
          ssh-keygen -y -f ~/.ssh/gcp_deploy > ~/.ssh/gcp_deploy.pub

      - name: Publish on the VM
        # Fetch and extract unprivileged, guard again, then exactly one privileged command,
        # pinned byte for byte in sudoers.
        run: |
          set -euo pipefail
          gcloud compute ssh web-server --quiet \
            --zone=europe-west1-b --project=cyberphunk-agency \
            --tunnel-through-iap --ssh-key-file="$HOME/.ssh/gcp_deploy" \
            --command "set -eu
              rm -rf /tmp/cypherpunk-agency-deploy /tmp/cypherpunk-agency-deploy.tgz
              /snap/bin/gcloud storage cp 'gs://${BUCKET}/${OBJECT}' /tmp/cypherpunk-agency-deploy.tgz
              mkdir -p /tmp/cypherpunk-agency-deploy
              tar -xzf /tmp/cypherpunk-agency-deploy.tgz -C /tmp/cypherpunk-agency-deploy
              test -f /tmp/cypherpunk-agency-deploy/index.html
              grep -qF '<title>[cypherpunk.agency]</title>' /tmp/cypherpunk-agency-deploy/index.html
              test -s /tmp/cypherpunk-agency-deploy/og-image.png
              sudo /bin/cp -rT /tmp/cypherpunk-agency-deploy /mnt/pd/data/services/static/cypherpunk-agency
              rm -rf /tmp/cypherpunk-agency-deploy /tmp/cypherpunk-agency-deploy.tgz"

      - name: Verify live
        # A green publish only says bytes moved. Check that apex and www serve exactly this
        # build, the og-image is a real PNG, the fonts load, and /good-friday/ survived.
        run: |
          set -euo pipefail
          OUT=packages/plaza-design-demo/dist-homepage
          fetch() { curl -fsS --retry 5 --retry-delay 3 --retry-all-errors -H 'Cache-Control: no-cache' "$@"; }

          for host in "$SITE_URL" https://www.cypherpunk.agency; do
            fetch "$host/" -o served.html
            grep -qF '<title>[cypherpunk.agency]</title>' served.html || { echo "::error::$host/ lacks the expected title"; exit 1; }
            cmp -s served.html "$OUT/index.html" || { echo "::error::$host/ does not serve this build"; exit 1; }
          done

          read -r code ctype size < <(fetch -o served.png -w '%{http_code} %{content_type} %{size_download}\n' "$SITE_URL/og-image.png" | tr -d '\r')
          echo "og-image.png: $code $ctype $size B"
          [ "$code" = 200 ] && [ "$ctype" = image/png ] && [ "$size" -gt 0 ] || { echo "::error::og-image.png check failed"; exit 1; }
          cmp -s served.png "$OUT/og-image.png" || { echo "::error::served og-image.png differs from this build"; exit 1; }

          for f in "$OUT"/fonts/*.woff2; do
            fetch -o /dev/null "$SITE_URL/fonts/$(basename "$f")"
          done

          gf=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL/good-friday/")
          [ "$gf" = 200 ] || { echo "::error::/good-friday/ returned $gf"; exit 1; }

          echo "live: $SITE_URL at $GITHUB_SHA"
