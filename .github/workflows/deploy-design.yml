name: Deploy design.cypherpunk.agency

# Push to production → build packages/plaza-design-demo → publish to the Caddy VM at
# /mnt/pd/data/services/static/design → live at https://design.cypherpunk.agency.
#
# Transport: .github/actions/publish-to-vm — stage the tarball in GCS (create-only, under
# plaza-design/), then one IAP-tunnelled SSH call as the forced-command, non-root VM user
# `deploy-plaza`: `publish design <object>`. The VM pulls, extracts, re-checks and copies;
# CI never extracts or sudos on the VM.
#
# `design` is an exact mirror (rsync --delete into static/design), not an overlay: Vite
# content-hashes every asset filename, so an overlay would keep every previous build's
# JS/CSS/woff2 forever. Because --delete is destructive if handed an empty tree, the
# build is guarded in CI (dist/index.html must exist) and again on the VM.
#
# OPS PREREQS (server-setup side):
#   - Caddy block `design.cypherpunk.agency` → root /static/design, try_files SPA
#     fallback, @assets immutable / @nonassets no-cache. Explicit block required:
#     cypherpunk.agency has NO wildcard, so without it the host gets no cert.
#   - DNS: existing wildcard *.cypherpunk.agency A record (easyname).
#   - VM user deploy-plaza + forced command; repo secret VM_DEPLOY_SSH_KEY.
#
# NOTE: fonts must stay self-hosted. The VM's shared CSP has no font-src (falls back
# to default-src 'self'), so any @import from fonts.googleapis.com silently drops the
# site to fallback monospace while still returning 200 everywhere. Verify with
# `document.fonts.size` (must be 4), never by looking at the page — IBM Plex Mono is
# installed locally on the author's machine and masks the bug.
#
# PUBLIC REPO: logs and this file are world-readable. Never use pull_request_target, never
# echo secrets, tokens or VM addresses, never print curl's redirect_url or gcloud debug output.

# Only `production` publishes (push, or workflow_dispatch run on the production ref);
# GCP WIF is pinned to refs/heads/production.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-design
  cancel-in-progress: false

jobs:
  build:
    # No id-token here: `pnpm install` runs third-party code, and it never gets the
    # ability to mint a GCP identity.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:design-demo

      - name: Guard + package
        # Fail before anything leaves the runner if the build produced no entry point.
        # A missing index.html would mean an empty tree meeting `rsync --delete`.
        run: |
          set -euo pipefail
          DIST=packages/plaza-design-demo/dist
          test -f "$DIST/index.html" || { echo "::error::$DIST/index.html missing — refusing to deploy"; exit 1; }
          grep -q 'src="/assets/' "$DIST/index.html" || { echo "::error::index.html does not reference /assets/ absolutely — Vite base must be '/' or deep links white-page"; exit 1; }
          ! grep -rq 'fonts.googleapis.com' "$DIST"/assets/*.css || { echo "::error::built CSS imports Google Fonts — the VM CSP blocks it; self-host the font"; exit 1; }
          if find "$DIST" ! -type f ! -type d | grep -q .; then
            echo "::error::dist contains non-regular files (symlinks?) — the VM refuses them"; exit 1
          fi
          tar -czf design.tar.gz -C "$DIST" .
          ls -l design.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: design
          path: |
            design.tar.gz
            packages/plaza-design-demo/dist/index.html
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://design.cypherpunk.agency/
    # Job-level permissions replace the workflow-level block: only this job can mint
    # the OIDC token for Workload Identity Federation.
    permissions:
      contents: read
      id-token: write
    steps:
      # Only for the local publish-to-vm action; nothing is built in this job.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions

      - uses: actions/download-artifact@v4
        with:
          name: design

      # Keyless: no GCP_SA_KEY exists for this repo any more. The SA trusts ONLY
      # attribute.repository == cypherpunk-agency/plaza-design on refs/heads/production.
      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/422633553646/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: deploy-plaza-design@cyberphunk-agency.iam.gserviceaccount.com
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v3

      - name: Stage + publish
        uses: ./.github/actions/publish-to-vm
        with:
          target: design
          tarball: design.tar.gz
          access-token: ${{ steps.auth.outputs.access_token }}
          ssh-key: ${{ secrets.VM_DEPLOY_SSH_KEY }}

      - name: Verify live
        # A green deploy is not proof the site serves. Check the deep route (a broken
        # SPA still 200s on /), that the served shell references the hash we just built,
        # and that the asset is reachable.
        run: |
          set -euo pipefail
          sleep 5
          JS=$(grep -o '/assets/[^"]*\.js' packages/plaza-design-demo/dist/index.html | head -1)
          echo "expecting asset: $JS"
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://design.cypherpunk.agency/demos/gallery)
          [ "$code" = "200" ] || { echo "::error::/demos/gallery returned $code"; exit 1; }
          curl -sS https://design.cypherpunk.agency/demos/gallery | grep -q "$JS" \
            || { echo "::error::served index.html does not reference $JS — deploy did not land"; exit 1; }
          acode=$(curl -sS -o /dev/null -w '%{http_code}' "https://design.cypherpunk.agency$JS")
          [ "$acode" = "200" ] || { echo "::error::asset $JS returned $acode"; exit 1; }
          echo "live: https://design.cypherpunk.agency"
